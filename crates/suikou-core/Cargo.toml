[package]
name = "suikou-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 既定では形態素解析を含めない。lindera の API はバージョン差が大きいため、
# 依存を切り離しておくと本体のテストが形態素解析なしで回せる。
default = []
lindera-unidic = ["dep:lindera"]

[[example]]
name = "dict_load"
required-features = ["lindera-unidic"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
lindera = { workspace = true, optional = true }
