name = "service"

# 頑健な指標。ジャンルが変わっても人間帯と重ならない。
[thresholds."ja.mattr100"]
value = 0.60
direction = "above"
severity = "warning"
guidance = "同じ対象は同じ語で呼ぶ。言い換えを止める"

[thresholds."ja.prose_ratio"]
value = 0.75
direction = "below"
severity = "warning"
guidance = "箇条書きに分解した内容を地の文に戻す"

[thresholds."ja.renyo_te_ratio"]
value = 3.0
direction = "above"
severity = "warning"
guidance = "「〜し、」で繋いだ節を分割するか「〜して、」に変える"

[thresholds."ja.renyo_per_1k"]
value = 4.0
direction = "above"
severity = "warning"
guidance = "連用中止を減らし、文を分ける"

[thresholds."ja.demonstrative_per_1k"]
value = 4.5
direction = "below"
severity = "warning"
guidance = "段落間の接続に指示詞を使い、名詞の再掲を減らす"

[thresholds."ja.list_ratio"]
value = 0.25
direction = "above"
severity = "warning"
guidance = "箇条書きを地の文に戻す"

# ジャンルとトピックへの感度が高い。ベースラインが揃うまで info に置く。
[thresholds."ja.keishiki_meishi_per_1k"]
value = 8.5
direction = "below"
severity = "info"
guidance = "漢語の名詞化を「〜すること」等の和語表現に戻す"

[thresholds."ja.kango_ratio"]
value = 0.52
direction = "above"
severity = "info"
guidance = "定着したカタカナ語を使い、漢語の名詞を重ねない。和語の動詞に置き換えてはならない"

[thresholds."en.mattr100"]
value = 0.71
direction = "above"
severity = "warning"
guidance = "Use the same word for the same thing. Stop varying the vocabulary"

[thresholds."en.prose_ratio"]
value = 0.65
direction = "below"
severity = "warning"
guidance = "Move content out of bullet lists back into prose"

[thresholds."en.simile_marker_per_1k"]
value = 0.8
direction = "below"
severity = "warning"
guidance = "If you use a comparison, mark it as a simile or an example"

# 型ごとの調整。入り口の README と参照の文書では硬さが違う。
#
# 著名な OSS の README を実測して導いた。
# 英語 240件（199組織、8言語）、日本語 150件（144組織）である。
# 既定の閾値を当てると、README では次の率で発火する。
#
# | 指標 | README | 参照 | 比 |
# |---|---|---|---|
# | en.mattr100 | 70% | 15% | 4.7 |
# | en.prose_ratio | 32% | 11% | 2.9 |
# | en.simile_marker_per_1k | 74% | 45% | 1.6 |
#
# 発火率が 70% の指標は、文書の性質ではなく閾値の不一致を示している。
# 日本語の README は参照より漢語率が高い（0.62 対 0.52）。
# 硬さの差は一方向ではない。経緯は D-41 にある。
[doctype.readme]
reason = "入り口の文書。地の文が少なく、語彙は広く、名前と機能の列挙で漢語が増える"

[doctype.readme.thresholds."en.mattr100"]
value = 0.87

[doctype.readme.thresholds."en.prose_ratio"]
value = 0.17

[doctype.readme.thresholds."ja.mattr100"]
value = 0.75

[doctype.readme.thresholds."ja.prose_ratio"]
value = 0.20

[doctype.readme.thresholds."ja.kango_ratio"]
value = 0.62

[doctype.readme.thresholds."ja.renyo_te_ratio"]
value = 10.0

# 決定の記録の調整。公開されている ADR 190件を実測して導いた。
#
# 既定の閾値を当てると `en.mattr100` が 45%、`en.prose_ratio` が 45% で発火する。
# 同じ語数帯（400から800語）の一般の文書では 17% と 20% である。
# 長さでは説明できず、型の性質である。
# 節が定型で短く、1件の決定を述べるため語の重複が少ない。
#
# `en.prose_ratio` はこの型では除外する。
# `suikou baseline corpus/cache/adrs` が、較正値 -0.18 は値域の外に出ると報告する。
# 分布が広すぎて境界を引けない。数値を選ぶのではなく、当てない。
#
# 既定の根拠（人間 0.66 から 0.97）は地の文中心のコーパスで測ったものであり、
# 定型の記録には成立しない。経緯は D-43 にある。
#
# 日本語の ADR のコーパスが無いため、日本語側は調整していない。
[doctype.decision]
reason = "決定の記録。節が定型で短く、1件の決定を述べるため語の重複が少ない"
disable = ["en.prose_ratio"]

[doctype.decision.thresholds."en.mattr100"]
value = 0.88

# 設計の型の調整。Rust RFC 200件を実測して導いた。
# 既定の閾値では `en.mattr100` が 19% で発火する。参照コーパスの 15% より高い。
# 提案の文書は扱う対象ごとに語彙が変わり、語の重複が少ない。
# `suikou baseline corpus/cache/rfcs` の較正値を採った。
#
# 日本語の提案の文書のコーパスが無いため、日本語側は調整していない。
[doctype.design]
reason = "提案の文書。扱う対象ごとに語彙が変わり、語の重複が少ない"

[doctype.design.thresholds."en.mattr100"]
value = 0.76

[doctype.design.thresholds."en.prose_ratio"]
value = 0.54
