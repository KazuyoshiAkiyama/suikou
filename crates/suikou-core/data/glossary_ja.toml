# ---------------------------------------------------------------------------
# 選好する一般語。英語の術語に当てる日本語を、2つ以上の一般語から選ぶ。
#
# ここに載るのは、どちらも日本語として通る一般語である。
# `基準値` と `ベースライン` はどちらも誤りではない。揃っていないことが問題である。
# PLaMo Translate が同じ語を文によって `ベースライン` と `基準値` に分けたことで、
# 訳語のモデルでは決まらないと分かった。選好はこちらで決める。
#
# プロジェクト固有の語は、ここではなく `.suikou/terms.toml` に置く。
# 効き方が違う。固有の語は定義であって選好ではなく、誤ると意味が変わる。
# 一方こちらは、どちらでも意味は通るが揃えたい語である。経緯は D-38 にある。
#
# `rejected` は、英語を一語ずつ写した言い方か、選ばなかった一般語である。
# `keep` は、同じ字を文字どおりの意味で使う形で、置き換えてはならない。
# ---------------------------------------------------------------------------

[[term]]
concept = "root cause"
preferred = "根本原因"
rejected = ["根因"]
evidence = "参照コーパスで根因 0 / 根本原因 2。PLaMo も根本原因と訳す"

[[term]]
concept = "time window"
preferred = "時間枠"
rejected = ["時間窓"]
evidence = "参照コーパスで時間窓 0 / 時間枠 1。PLaMo は時間枠と時間幅を出す"

[[term]]
concept = "baseline"
preferred = "ベースライン"
rejected = ["基準線"]
keep = ["基準の実装"]
evidence = "参照コーパスで基準線 0 / ベースライン 12。PLaMo は文によってベースラインと基準値に分かれた"

[[term]]
concept = "background job"
preferred = "バックグラウンドジョブ"
rejected = ["背景実行"]
evidence = "参照コーパスで背景実行 0 / バックグラウンド 20。PLaMo もバックグラウンドジョブと訳す"

[[term]]
concept = "watcher"
preferred = "ウォッチャー"
rejected = ["見張り"]
evidence = "参照コーパスで見張り 0 / ウォッチャー 55。PLaMo はウォッチャーと観測者を出す"

[[term]]
concept = "version"
preferred = "バージョン"
rejected = ["版"]
keep = ["第2版", "日本語版", "改訂版", "初版", "英語版"]
evidence = "kata_pairs_ja.toml の実測。PLaMo もバージョンと訳す"

[[term]]
concept = "branch"
preferred = "ブランチ"
rejected = ["枝"]
keep = ["枝分かれ", "木の枝"]
evidence = "kata_pairs_ja.toml の実測（分岐→ブランチ）。PLaMo もブランチと訳す"

# 身体の動作の像が強い和語の動詞。技術文書では抽象の漢語を選ぶ。
#
# どちらも日本語として通るが、像が具体的すぎて説明の文には粗い。
# 参照コーパスとこのリポジトリの文書を比べると、ここに挙げた語は8倍から32倍多かった。
# `register/rare-wago` は参照に16件あるため拾えない（LogRatio の下限が128倍）。
# 頻度では届かないが、選好としては決められる。

[[term]]
concept = "exclude"
preferred = "除外する"
rejected = ["外す"]
keep = ["取り外す", "的を外す"]
evidence = "参照 0.06 / このリポジトリ 1.90（万字あたり）。32倍"

[[term]]
concept = "remove"
preferred = "除去する"
rejected = ["落とす"]
keep = ["読み落とす", "見落とす", "書き落とす"]
evidence = "参照 0.01 / このリポジトリ 0.30（万字あたり）。30倍"

[[term]]
concept = "detect"
preferred = "検出する"
rejected = ["拾う"]
evidence = "参照 0.00 / このリポジトリ 0.60（万字あたり）。参照はほぼ使わない"

[[term]]
concept = "unify"
preferred = "統一する"
rejected = ["寄せる"]
keep = ["取り寄せる", "呼び寄せる"]
evidence = "参照 0.00 / このリポジトリ 0.20（万字あたり）。参照はほぼ使わない"

[[term]]
concept = "collate"
preferred = "照合する"
rejected = ["突き合わせる"]
evidence = "参照 0.00 / このリポジトリ 0.10（万字あたり）。参照はほぼ使わない"

# ---------------------------------------------------------------------------
# 共起。名詞と動詞の組み合わせが成立しない形を直す。
#
# 語を1つずつ選ぶだけでは足りない。`規範` も `置く` も語としては不適切ではないが、
# `規範を置く` は組み合わせが成立しない。`規範とする` が適切である。
#
# 自動では決められない。正しい動詞を統計から提示する方法は先行研究にあるが、
# 動詞 32,822 語を上位 600 語ほどに絞って正解率80%であり、提示には使えない
# （中野・冨浦 2011）。ここに書く組は人が決める。経緯は T19 にある。
#
# `rejected` の側は名詞を含む句で書く。動詞だけでは、ほかの名詞に当たってしまう。
# ---------------------------------------------------------------------------

[[term]]
concept = "establish as a norm"
preferred = "規範とする"
rejected = ["規範を置く", "規範を敷く"]
evidence = "`置く` は物を据える像、`敷く` は面に広げる像で、どちらも規範を受けない"
