# 日本語の技術文書の用語集。
#
# 2つのことを分けて持つ。混ぜると、根拠の出どころが分からなくなる。
#
#   [[term]]        どの語を選ぶか。語の選択。根拠は実測の用法。
#   [[orthography]] その語をどう書くか。表記。根拠は明文の規約と実測。
#
# 語の選択は、参照コーパスの頻度と PLaMo Translate の訳語で決める。
# 表記は、JTCA「外来語（カタカナ）表記ガイドライン」第3版を出発点にして、
# 参照コーパスで確かめる。規約と実測が食い違う語は実測に従い、食い違いを書き残す。
#
# 汎用の形（textlint-rule-prh の辞書と CSV）は `glossary/` にある。
# 作り直す手順は `research/glossary/build_glossary.py` にある。

[meta]
measured = "2026-11-13"
corpus = "corpus/cache/pro_ja"
corpus_chars = 4382318
sources = ["kubernetes/website(ja)", "mdn/translated-content(ja)", "vuejs-translations/docs-ja"]
probe = "pfnet/plamo-3-translate-2b-GGUF Q4_K_M"
orthography_rule = "語ごとに実測で決める。決まらない語は長音に倒す（D-38）"
orthography_reference = "JTCA 外来語（カタカナ）表記ガイドライン 第3版（2015）"

# ---------------------------------------------------------------------------
# 表記。同じ語の書き分けを1つに決める。
#
# 語ごとに実測で決める。規約から導かない。
# JTCA「外来語（カタカナ）表記ガイドライン」第3版は英語の語尾 -er、-or、-ar、-y を
# 長音符号で書くとしているが、実測では -y と `コンテナ` が逆であった。
#
# 実測で決まらない語は長音を付ける側に倒す。決まらないとは次の場合である。
#
#   優勢な側が2倍に届かない、または合計が50件に届かない。
#
# 倒す先を長音ありにしたのは、JTCA の規約がそちらであり、
# -er、-or、-ar の語では実測もそちらだったためである。
# 新しい語を足すときは、まず参照コーパスで数える。
# 数えられない語は長音を付ける。
#
# 一律にするとどちらの向きでも大きく外す。参照コーパス438万字での食い違いは、
# 全部長音ありで 45.9%、全部長音なしで 54.1%、語ごとに実測で 9.5% であった。
# 経緯は D-38 にある。
# ---------------------------------------------------------------------------

[[orthography]]
preferred = "サーバー"
variants = ["サーバ"]
rule = "measured"
evidence = "長音 591 / 長音なし 130"

[[orthography]]
preferred = "ユーザー"
variants = ["ユーザ"]
rule = "measured"
evidence = "長音 1830 / 長音なし 328"

[[orthography]]
preferred = "ブラウザー"
variants = ["ブラウザ"]
rule = "measured"
evidence = "長音 441 / 長音なし 120"

[[orthography]]
preferred = "パラメーター"
variants = ["パラメータ"]
rule = "measured"
evidence = "長音 158 / 長音なし 6"

[[orthography]]
preferred = "クラスター"
variants = ["クラスタ"]
rule = "measured"
evidence = "長音 1279 / 長音なし 5"

[[orthography]]
preferred = "レイヤー"
variants = ["レイヤ"]
rule = "measured"
evidence = "長音 93 / 長音なし 2"

[[orthography]]
preferred = "フォルダー"
variants = ["フォルダ"]
rule = "fallback-choon"
evidence = "長音 21 / 長音なし 10。差が2倍に届かず実測で決まらないため長音に倒す"

[[orthography]]
preferred = "コンピューター"
variants = ["コンピュータ"]
rule = "fallback-choon"
evidence = "長音 28 / 長音なし 34。差が2倍に届かず実測で決まらないため長音に倒す"

[[orthography]]
preferred = "コンテナ"
