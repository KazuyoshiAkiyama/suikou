# 型を選ぶための問い。`suikou doctype` が出力する。
#
# ツールは問わない。ツリーを出力して、呼び出す側が読者に問う。
# CI とエージェントから呼ばれるため、対話的な入力を置かない。
# `brief` が指示を出力して書く側に委ねるのと同じ形である。
#
# 各選択肢は `next`（次の問い）か `doctype`（決まった型）のどちらかを持つ。
# 試験が、すべての型にこのツリーから到達できることと、
# すべての選択肢の行き先が実在することを確かめている。
#
# 最初の問いは Diátaxis の軸から取った。
# 読者が何をしようとしているかで分けると、文書の形が決まる。
[[select]]
id = "purpose"
ja = "この文書の読者は何をしようとしているか"
en = "What is the reader trying to do?"

[[select.options]]
ja = "このプロジェクトを初めて見る"
en = "Seeing this project for the first time"
doctype = "readme"

[[select.options]]
ja = "手順どおりに作業する"
en = "Following a procedure"
doctype = "howto"

[[select.options]]
ja = "値や定義を引く"
en = "Looking up a value or a definition"
doctype = "reference"

[[select.options]]
ja = "何であるか、なぜこうなっているかを理解する"
en = "Understanding what it is, or why it is this way"
next = "proposal"

[[select.options]]
ja = "決定や変更の経緯を追う"
en = "Following the record of decisions or changes"
next = "record"

[[select]]
id = "proposal"
ja = "これから作るものの提案か、既にあるものの入口か"
en = "A proposal for what will be built, or an entry point to what exists?"

[[select.options]]
ja = "これから作るものの提案"
en = "A proposal for what will be built"
next = "staged"

[[select.options]]
ja = "既にあるものの入口"
en = "An entry point to what exists"
doctype = "overview"

# 提案の型を分ける問い。
# KEP と Rust RFC の違いは、運用の準備を問うかどうかにある。
# 段階的に出すものは、試験計画と昇格条件と切り戻しを決めないと出せない。
[[select]]
id = "staged"
ja = "段階的に出すか。試験計画、昇格条件、切り戻しを決める必要があるか"
en = "Is it rolled out in stages, needing a test plan, graduation criteria and a rollback?"

[[select.options]]
ja = "段階的に出す"
en = "Rolled out in stages"
doctype = "enhancement"

[[select.options]]
ja = "一度に出す"
en = "Shipped in one step"
doctype = "design"

[[select]]
id = "record"
ja = "1件の決定か、記録を束ねたものか"
en = "One decision, or a collection of records?"

[[select.options]]
ja = "1件の決定"
en = "One decision"
doctype = "decision"

[[select.options]]
ja = "記録を束ねたもの"
en = "A collection of records"
doctype = "log"
