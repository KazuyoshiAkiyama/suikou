# 文書の型ごとの必須の節と、その推奨する順序。
#
# 出典は次のとおり。
#   design   … Rust RFC テンプレート、Kubernetes Enhancement Proposal
#   decision … Michael Nygard の Architecture Decision Record
#   howto    … Diátaxis の how-to guide
#   readme   … 著名 OSS の README 240件の実測。standard-readme の節を出発点にした
#   overview … 上のいずれでもない入口の文書
# 節を並べた順序が推奨する順序になる。RFC 7322 が必須の節と順序を定める前例である。
#
# 節の同定は見出しの文字列と同義語による。
# 同義語にはカタカナ語も入れる。`register/prefer-katakana` がカタカナ語を勧めるため、
# 漢語だけを並べると、この道具の助言に従った文書を構造の規則が拒むことになる。構造の規則は言語を問わないが、
# 節の名前だけは言語ごとに持つ。
#
# question と writes は、検出ではなく誘導のために持つ。言語ごとに持つ。
#
# lead_ok は、標題の直下の導入でその節を代えられることを示す。
# 主題を述べる節にだけ与える。前提や文脈は導入では代えられない。
# `suikou plot` と `suikou brief` が、書く前にこれを型枠として示す。

# design の必須の節は、扱う範囲と扱わない範囲を含まない。
# その二つは KEP の様式であって、Rust RFC テンプレートには無い。
# Rust RFC 200件に当てたところ、扱わない範囲が199件、扱う範囲が198件で発火した。
# 必須から外しても、問いと書くことは残す。plot と brief はそこを尋ね続ける。
# 経緯は D-32 にある。
#
# design の同義語は Rust RFC の実物で確かめてある。
# `Explanation` は `Guide-level explanation` と `Reference-level explanation` を含む。
# RFC テンプレートが「どう動くか」をこの名前で呼ぶためである。
[doctype.design]
# 何を試して何が駄目だったかは、この型では伝えるべき中身である。
work_notes_ok = true
description = "提案と設計。何を作るか、なぜ要るか、どこまでやるかを示す"
description_en = "A proposal or design: what is being built, why it is needed, and how far it goes"
sections = [
  { id = "summary",      required = true, lead_ok = true,  ja = ["概要", "要約", "サマリー", "何を作るか"], en = ["Summary", "Overview", "Abstract"] , question = "何についての文書か", writes = "読み手が最初の数行で主題をつかめるように、一段落で書く。詳細は後の節に置く" , question_en = "What is this document about?", writes_en = "Give the subject in one paragraph, so the reader has it within a few lines. Leave the detail to the later sections" },
  { id = "motivation",   required = true,  ja = ["動機", "背景", "解こうとしている問題", "目的"], en = ["Motivation", "Background", "Problem"] , question = "なぜ必要なのか", writes = "解こうとしている問題と、放置した場合に何が困るかを書く。解き方はここでは書かない" , question_en = "Why is it needed?", writes_en = "State the problem and what goes wrong if it is left alone. Do not give the solution here" },
  { id = "scope",        required = false, ja = ["扱う範囲", "スコープ", "目標", "適用範囲"], en = ["Scope", "Goals", "What is covered"] , question = "どこまでやるのか", writes = "扱う対象と、どの場面で使うかを書く" , question_en = "How far does it go?", writes_en = "State what it covers and where it applies" },
  { id = "non_goals",    required = false, ja = ["扱わない範囲", "非目標", "やらないこと"], en = ["Non-goals", "Non-Goals", "Out of scope"] , question = "何をやらないのか", writes = "扱わないものを明示する。境界を書かないと、読み手が期待を広げる" , question_en = "What does it not do?", writes_en = "Name what is left out. Without the boundary the reader will expand the expectation" },
  { id = "design",       required = true,  ja = ["設計", "仕組み", "構成", "どう動くか", "実装", "提案", "アーキテクチャ"], en = ["Design", "Design details", "How it works", "Architecture", "Explanation", "Detailed design", "Implementation", "Proposal", "Proposed solution"] , question = "どう動くのか", writes = "構成と動き方を書く。判断の根拠は代替案の節に置く" , question_en = "How does it work?", writes_en = "Describe the structure and the behaviour. Keep the reasoning in the alternatives section" },
  { id = "alternatives", required = false, ja = ["代替案", "検討した案", "採らなかった案"], en = ["Alternatives", "Rationale and alternatives", "Prior art"] , question = "ほかにどんな案があったか", writes = "検討して採らなかった案と、採らなかった理由を書く" , question_en = "What else was considered?", writes_en = "Record the options that were rejected, and why" },
  { id = "open",         required = false, ja = ["決めていないこと", "未決事項", "残る課題"], en = ["Open questions", "Unresolved questions", "Future possibilities"] , question = "まだ決まっていないことは何か", writes = "決めていない論点を残す。決めたことは決定の記録に移す" , question_en = "What is still undecided?", writes_en = "Keep the open questions here. Move anything settled into the decision record" },
]

[doctype.decision]
# 何を試して何が駄目だったかは、この型では伝えるべき中身である。
work_notes_ok = true
description = "決定の記録。文脈、決定、帰結を残す"
description_en = "A decision record: the context, the decision, and the consequences"
sections = [
  { id = "context",      required = true,  ja = ["文脈", "コンテキスト", "背景", "経緯"], en = ["Context", "Background"] , question = "どういう状況で決めたのか", writes = "決定を迫った事情を書く。決定そのものはここでは書かない" , question_en = "What situation forced the decision?", writes_en = "Describe the circumstances. Do not state the decision itself here" },
  { id = "decision",     required = true,  ja = ["決定", "決めたこと"], en = ["Decision"] , question = "何を決めたのか", writes = "決めたことを一文で言い切る。理由は文脈の節に置く" , question_en = "What was decided?", writes_en = "State the decision in one sentence. Keep the reasoning in the context section" },
  { id = "consequences", required = true,  ja = ["帰結", "影響", "結果"], en = ["Consequences", "Impact"] , question = "決めた結果どうなるのか", writes = "良い面と悪い面の両方を書く。悪い面を書かない決定記録は信用されない" , question_en = "What follows from the decision?", writes_en = "Give both the good and the bad. A decision record without the bad side is not trusted" },
]

# howto の必須の節は前提だけとする。
# 手順と確認を必須にしたところ、Kubernetes の task 頁120件すべてで発火した。
# 手順そのものは本文であって、見出しは頁ごとに固有になる。
# 見出しを `Steps` にそろえさせるのは、かえって読みにくい。
# 必須から外しても、問いと書くことは残す。plot と brief はそこを尋ね続ける。
# 経緯は D-31 にある。
[doctype.howto]
description = "手順。前提から始めて、確認で終わる"
description_en = "A procedure: it starts at the prerequisites and ends at the check"
sections = [
  { id = "prerequisites", required = true, ja = ["前提", "用意するもの", "事前準備"], en = ["Prerequisites", "Before you begin"] , question = "始める前に何が要るのか", writes = "前提の環境と、読み手が既に知っている必要のあることを書く" , question_en = "What is needed before starting?", writes_en = "State the environment assumed and what the reader must already know" },
  { id = "steps",         required = false, ja = ["手順", "やり方", "ステップ"], en = ["Steps", "Procedure", "Instructions"] , question = "どうやるのか", writes = "順番に並べる。一つの手順に一つの操作だけを置く" , question_en = "How is it done?", writes_en = "Put the steps in order, with one action per step" },
  { id = "verify",        required = false, ja = ["確認", "確かめ方"], en = ["Verify", "Verification", "Check your work"] , question = "うまくいったとどう分かるのか", writes = "期待する出力や状態を書く。確かめ方の無い手順は完了を判断できない" , question_en = "How does the reader know it worked?", writes_en = "Give the expected output or state. A procedure with no check cannot be called finished" },
]

[doctype.reference]
description = "定義。必須の節は置かない"
description_en = "A reference: no section is required"
sections = []

# 記録を束ねた文書。決定の記録の一覧、作業の一覧、変更の履歴である。
# 必須の節は置かない。記録ごとの様式は記録の側が持つ。
#
# `work_notes_ok` をこの型に与える。
# 何を試して何が駄目だったかは、記録を束ねた文書では伝えるべき中身である。
# `structure/work-note` が決定の記録そのものに発火していたため分けた。
#
# この型は検出を足さない。`reference` から緩めるだけである。
# 外部のコーパスで測っていないが、緩める方向であり、
# 当たらない規則を増やす側の危険は無い。経緯は D-42 にある。
[doctype.log]
work_notes_ok = true
description = "記録を束ねた文書。決定の記録、作業の一覧、変更の履歴"
description_en = "A log of records: decisions, tasks, or changes"
sections = []

# README の型。必須は先頭の一段落だけとする。
# 著名 OSS の README 240件（199組織、8言語）に当てて測った結果である。
# 見出しで同定できる節は、最も多い `入れ方` でも 62% にとどまる。
# 62% を必須にすると、著名 OSS の4割を拒むことになる。
#
# README は見出しに構造を持たない型である。
# 先頭の段落が主題を述べ、残りは射影ごとに分かれる。
# 先頭に段落を持つものが 78%、そのうち 300字以内が 83%、字数の中央値は 121 であった。
#
# what の同義語に、問いの形の見出しを入れてある。`## What's Rails?` が実例である。
# `What's new` と衝突しうるが、240件のうち衝突するのは1件だけで、
# 問いの形を採れるのは21件であった。足す方が得になる。
#
# 必須を先頭の段落だけにしても、問いと書くことは残す。plot と brief はそこを尋ね続ける。
# 経緯は D-39 にある。
[doctype.readme]
description = "README。先頭の一段落で何であるかを述べる"
description_en = "A README: the first paragraph says what the thing is"
sections = [
  { id = "what",     required = true, lead_ok = true, ja = ["何であるか", "概要", "これは何か", "とは", "について"], en = ["What it is", "What is", "What's", "Overview", "Introduction", "About", "Description"] , question = "これは何か。一文で言えるか", writes = "名前を主語にして、何であるかを述べる。背景や目的から始めない" , question_en = "What is it, in one sentence?", scale = "先頭の一段落に収める。300字以内。中央値は121字である" , scale_en = "One paragraph, within 300 characters; the median is 121" , writes_en = "Make the name the subject and say what it is. Do not open with background or intent" },
  { id = "install",  required = false, ja = ["入れ方", "インストール", "導入", "始め方", "セットアップ"], en = ["Install", "Installation", "Setup", "Getting started", "Quick start", "Quickstart", "Building"] , question = "どう入れるのか", writes = "実行できる命令をそのまま置く。環境ごとの網羅は別の文書に譲る" , question_en = "How is it installed?", scale = "実行できる命令を1つ。前後の説明は2行ほどで足りる。約半数はコード塊を持たない" , scale_en = "One command that runs, with about two lines around it; half of them carry no code block" , writes_en = "Give a command that runs as written. Leave per-environment coverage to another document" },
  { id = "usage",    required = false, ja = ["使い方", "例", "使用例"], en = ["Usage", "Using it", "Example", "Examples", "Basic usage"] , question = "最短でどう使うのか", writes = "動く例を一つ置く。網羅は参照の文書に譲る" , question_en = "What is the shortest way to use it?", scale = "動く例を1つ。入れ方と同じくらいの分量に収める" , scale_en = "One example that runs, at about the same length as the install section" , writes_en = "Give one example that runs. Leave the exhaustive detail to the reference" },
  { id = "docs",     required = false, ja = ["文書", "ドキュメント", "詳しく"], en = ["Documentation", "Docs", "Guide", "Reference", "Learn more"] , question = "詳しくはどこを読むのか", writes = "詳しい文書への入口を置く。README に詳細を書き足さない" , question_en = "Where is the detail?", scale = "参照先だけを置く。README の節の中で短い側に入る" , scale_en = "The pointers only; among the shorter sections of a README" , writes_en = "Point to the fuller documentation. Do not grow the README into it" },
  { id = "contrib",  required = false, ja = ["寄与", "開発", "貢献"], en = ["Contributing", "Contribute", "Development", "Developing"] , question = "どう手を入れるのか", writes = "開発の始め方と、変更を出すときの約束を書く" , question_en = "How does someone contribute?", scale = "開発の始め方と約束。地の文2行ほどで足りる" , scale_en = "How to start and what a change must satisfy, in about two lines of prose" , writes_en = "State how to start developing and what a change must satisfy" },
  { id = "license",  required = false, ja = ["許諾", "ライセンス"], en = ["License", "Licence"] , question = "どの条件で使えるのか", writes = "許諾の名前を書く。全文は別のファイルに置く" , question_en = "Under what terms?", scale = "**最も短い節とする。** 名前と参照先だけで足りる" , scale_en = "**The shortest section.** The name and a pointer are enough" , writes_en = "Name the licence. Keep the full text in its own file" },
]

# overview の usage を必須から外した。
# 著名 OSS の README 240件に当てたところ、見出しで同定できないものが 195件（81%）あった。
# 同義語に Install と Installation と Setup と Getting started が無かったことも一因である。
# 足しても 41% にしか届かない。必須にできる水準ではない。
# 経緯は D-39 にある。
[doctype.overview]
description = "入口の文書。何であるかから始める"
description_en = "An entry point: it starts by saying what the thing is"
sections = [
  { id = "what",  required = true, lead_ok = true, ja = ["何であるか", "概要", "これは何か", "とは"], en = ["What it is", "What is", "What's", "Overview", "Introduction", "About"] , question = "これは何か", writes = "何であるかを最初の一段落で示す" , question_en = "What is it?", writes_en = "Say what it is in the first paragraph" },
  { id = "why",   required = false, ja = ["なぜ", "動機", "考え方"], en = ["Why", "Motivation", "How it is built"] , question = "なぜこれがあるのか", writes = "解く問題と、ほかとの違いを書く" , question_en = "Why does it exist?", writes_en = "State the problem it solves and how it differs from the alternatives" },
  { id = "usage", required = false, ja = ["使い方", "入れ方", "インストール", "始め方"], en = ["Usage", "Using it", "Install", "Installation", "Setup", "Getting started", "Quick start"] , question = "どう使うのか", writes = "最短の使い方を示す。網羅は参照の文書に譲る" , question_en = "How is it used?", writes_en = "Show the shortest path to using it. Leave the exhaustive detail to the reference" },
]

# 段階的に出す提案。Kubernetes Enhancement Proposal の様式から取った。
#
# `design` との違いは、運用の準備を問うことである。
# 試験計画、昇格条件、切り戻し、版の食い違い、監視を節として持つ。
# 段階的に出すものを扱うときは、これらを決めないと出せない。
#
# 必須は Summary、Motivation、Goals、Proposal の4つとする。
# 公開されている KEP 265件（19 SIG、1 SIG から25件まで）に当てて測った。
# 雛形のまま埋めていない KEP は除外してある。
#
# | 必須の組 | 発火率 |
# |---|---|
# | Summary | 2% |
# | + Motivation | 6% |
# | + Goals + Proposal | 9% |
# | + Non-Goals | 15% |
# | + Graduation Criteria + Test Plan | 29% |
#
# 運用の準備の節は必須から外した。Test Plan が 76%、Graduation Criteria が 92%、
# Upgrade / Downgrade が 57%、Version Skew が 58%、Production Readiness が 61% である。
# 必須から外しても、問いと書くことは残す。plot と brief はそこを尋ね続ける。
# 経緯は D-47 にある。
[doctype.enhancement]
work_notes_ok = true
description = "段階的に出す提案。試験計画と昇格条件と切り戻しを含む"
description_en = "A staged proposal: it carries the test plan, the graduation criteria and the rollback"
sections = [
  { id = "summary",      required = true, lead_ok = true, ja = ["概要", "要約", "サマリー"], en = ["Summary", "Overview", "Abstract"] , question = "何についての提案か", writes = "提案の中身を一段落で述べる。詳細は後の節に置く" , question_en = "What is the proposal?", writes_en = "Give the proposal in one paragraph; leave the detail to the later sections" },
  { id = "motivation",   required = true, ja = ["動機", "背景", "目的"], en = ["Motivation", "Background"] , question = "なぜ必要なのか", writes = "解こうとしている問題と、放置した場合に何が困るかを書く" , question_en = "Why is it needed?", writes_en = "State the problem and what goes wrong if it is left alone" },
  { id = "goals",        required = true, ja = ["目標", "達成すること", "ゴール"], en = ["Goals"] , question = "何を達成すれば完了なのか", writes = "達成を判定できる形で書く。判定できない目標は完了を決められない" , question_en = "What counts as done?", writes_en = "Write each goal so that it can be judged met; a goal that cannot be judged cannot be finished" },
  { id = "non_goals",    required = false, ja = ["扱わない範囲", "非目標", "やらないこと"], en = ["Non-Goals", "Non-goals", "Out of scope"] , question = "何をやらないのか", writes = "扱わないものを明示する。境界を書かないと、読者が期待を広げる" , question_en = "What does it not do?", writes_en = "Name what is left out; without the boundary the reader will expand the expectation" },
  { id = "proposal",     required = true, ja = ["提案", "提案の内容"], en = ["Proposal"] , question = "何をどう変えるのか", writes = "利用者から見た変化を書く。実装の詳細は設計の節に置く" , question_en = "What changes, and how?", writes_en = "Describe the change as the user sees it; keep the implementation in the design section" },
  { id = "user_stories", required = false, ja = ["利用者の話", "ユースケース", "利用の場面"], en = ["User Stories", "Use cases"] , question = "誰がどの場面で使うのか", writes = "利用者と場面を具体で書く。抽象のままでは設計を検証できない" , question_en = "Who uses it, and when?", writes_en = "Name the user and the situation concretely; an abstract one cannot check the design" },
  { id = "risks",        required = false, ja = ["危険と緩和", "リスク", "想定される問題"], en = ["Risks and Mitigations", "Risks"] , question = "何が起きうるか、どう抑えるか", writes = "起きうることと、それぞれの抑え方を対にして書く" , question_en = "What could go wrong, and how is it contained?", writes_en = "Pair each risk with how it is contained" },
  { id = "design",       required = false, ja = ["設計の詳細", "設計", "仕組み"], en = ["Design Details", "Design"] , question = "どう作るのか", writes = "構成と動き方を書く。判断の根拠は代替案の節に置く" , question_en = "How is it built?", writes_en = "Describe the structure and the behaviour; keep the reasoning in the alternatives section" },
  { id = "test_plan",    required = false, ja = ["試験計画", "テスト計画", "検証計画"], en = ["Test Plan", "Testing"] , question = "どう検証するのか", writes = "単体、統合、e2e のどこで何を確かめるかを書く" , question_en = "How is it verified?", writes_en = "State what is checked at the unit, integration and end-to-end levels" },
  { id = "graduation",   required = false, ja = ["昇格条件", "段階", "成熟度"], en = ["Graduation Criteria", "Maturity"] , question = "次の段階へ進む条件は何か", writes = "段階ごとに、進むための条件を判定できる形で書く" , question_en = "What takes it to the next stage?", writes_en = "For each stage, give a condition that can be judged met" },
  { id = "upgrade",      required = false, ja = ["移行と切り戻し", "アップグレード", "ロールバック"], en = ["Upgrade / Downgrade Strategy", "Upgrade"] , question = "入れたあと戻せるのか", writes = "移行の手順と、戻すときの手順を書く。戻せない変更はそう書く" , question_en = "Can it be rolled back?", writes_en = "Give the path in and the path back; if there is no way back, say so" },
  { id = "version_skew", required = false, ja = ["版の食い違い", "バージョンスキュー"], en = ["Version Skew Strategy", "Version skew"] , question = "新旧が混在したらどうなるのか", writes = "混在する組み合わせごとに、どう動くかを書く" , question_en = "What happens when versions mix?", writes_en = "State the behaviour for each combination that can coexist" },
  { id = "readiness",    required = false, ja = ["本番投入の確認", "運用の準備", "可観測性"], en = ["Production Readiness Review", "Production Readiness"] , question = "運用に乗せられるか", writes = "有効化と無効化、監視の指標、依存、規模の限界を書く" , question_en = "Is it ready to operate?", writes_en = "Cover enabling and disabling it, what to monitor, the dependencies and the scaling limits" },
  { id = "alternatives", required = false, ja = ["代替案", "検討した案", "採らなかった案"], en = ["Alternatives", "Rationale and alternatives"] , question = "ほかにどんな案があったか", writes = "検討して採らなかった案と、採らなかった理由を書く" , question_en = "What else was considered?", writes_en = "Record the options that were rejected, and why" },
