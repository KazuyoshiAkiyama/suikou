# 人間コーパスの実測値。閾値の根拠になる。
# 測定は research/ の Python 実装による。

[meta]
measured = "2026-09-15"
ja_native = ["kaityo256/sevendayshpc", "kaityo256/python_zero", "future-architect/coding-standards"]
ja_translated = ["kubernetes/website(ja)", "vuejs-translations/docs-ja", "linux kernel ja_JP"]
en = ["linux kernel", "gcc", "rust-lang/book", "django", "google/eng-practices",
      "awsdocs/amazon-s3-userguide", "awsdocs/aws-cloudformation-user-guide"]
note = "日本語のネイティブ執筆は解説書に偏っている。手順書型が不足している。"

