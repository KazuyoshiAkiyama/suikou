# 参照コーパスに無いが、このプロジェクトでは正しいと判断した語。
#
# 参照コーパスは Kubernetes、MDN、Vue の日本語訳で作ってある。
# いずれも Web の文書であり、計算や統計の語が手薄である。
# ここに挙げる語は、その偏りを補うためのものであり、文体の指摘から外す。
words = [
  "数える",   # 指標の定義で数を求める文脈に要る
  "割る",     # 除算。指標の定義に要る
  "並べる",   # 列挙の意味で使う
  "節",       # 文書の節。日本語の文書では普通に使う
  "偏る",     # 分布の偏り。統計の文脈で要る
  "収まる",   # 閾値の範囲に収まる
  "窓",       # MATTR の移動窓。術語である
  "片仮名",   # 日本語の表記を論じる文書に要る
  "平仮名",   # 同上
]
