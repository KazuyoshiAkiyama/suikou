# 参照コーパスに無いが、このプロジェクトでは正しいと判断した語。
#
# 参照コーパスは Kubernetes、MDN、Vue の日本語訳で作ってある。
# いずれも Web の文書であり、計算や統計の語が手薄である。
# ここに挙げる語は、その偏りを補うためのものであり、文体の指摘から外す。
words = [
  "数える",   # 指標の定義で数を求める文脈に要る
  "割る",     # 除算。指標の定義に要る
  "並べる",   # 列挙の意味で使う
  "節",       # 文書の節。日本語の文書では普通に使う
  "偏る",     # 分布の偏り。統計の文脈で要る
  "収まる",   # 閾値の範囲に収まる
  "窓",       # MATTR の移動窓。術語である
  "片仮名",   # 日本語の表記を論じる文書に要る
  "平仮名",   # 同上

  # 対応表（カタカナ語の優先）から外す語。この文書では別の意味で使っている。
  "記録",     # 決定の記録。ログではない
  "一覧",     # 作業の一覧。箇条書きの「リスト」と区別する
  "比率",     # 漢語率や地の文比率。「レート」ではなく割合である
  "経路",     # 本番の経路、失敗の経路。ファイルの「パス」ではない
  "分岐",     # 条件分岐。git の「ブランチ」ではない
  "実体",     # ファイルの実体。「インスタンス」ではない
]
