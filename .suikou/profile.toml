# このリポジトリの文書に当てる閾値。読み込んだプロファイルに重ねる。
#
# 2026-11-24 のコミット 7d07fc5 で Gemini（neon）が26ファイルを書き直した。
# その文体をこのリポジトリの文書の基準として採用したため、閾値を引き直す。
# これは組み込みのプロファイルを置き換えるものではない。
# `crates/suikou-core/profiles/oss.toml` の既定は人間コーパスの実測による較正であり、
# 利用者の文書に対する閾値は変わらない。
#
# この上書きは作業ディレクトリから読まれる（`check.rs` の `OVERRIDE_PATH`）。
# リポジトリの外のファイルをこのディレクトリから検査すると、その文書にも当たる。
#
# 値は `suikou baseline` の出力をそのまま採らず、このリポジトリの日本語文書9件の
# 実測の最大値に 3% 程度の余裕を足して決めた。`baseline` が使う Tukey の上側フェンス
# （Q3 + 1.5×IQR）はコーパス内の外れ値を見つけるための道具であり、
# 文体の基準を決める道具ではない。標本9件では最大値を大きく超える位置に落ちる。
# `ja.renyo_te_ratio` では較正値 23.21 が実測の最大 12.75 の 1.8 倍、
# かつ AI 4モデルの実測範囲の上端 15.94 をも超えた。
# 較正値を採ると、この指標は AI 文を一切検出しなくなる。
#
# 実測は次のコマンドで確認できる。閾値そのものは較正値ではないため、
# このコマンドの出力とは一致しない。
#
#   suikou baseline CLAUDE.md README.ja.md docs/content/ja/*.md --lang ja
#
# `ja.list_ratio` と `ja.prose_ratio` は上書きしない。
# 実測は 0.167（既定 0.25）と 0.870（既定 0.75）で、どちらも一度も発火していない。
# 発火していない指標を緩めると、根拠の無い緩和になる。
#
# `ja.demonstrative_per_1k` も上書きしない。
# この指標は較正に向かない。2026-11-24 時点の文書では境界が値域の外に出て
# `baseline` が較正を断った。指示詞を補ったあとは較正できるが、
# 既定の 4.5 を保ち、下回っていた文書の側を直す方針を採る。
# neon の書き直しはこの指標を人間ネイティブの範囲 5.69–6.47 に改善しており、
# 文書を直す方向が採用した文体に反しない。

reason = """
neon の文体（7d07fc5）をこのリポジトリの文書の基準として採用した。
閾値はこのリポジトリの日本語文書9件の実測の最大値から決めた。
型ごとの `[doctype.*]` に置かないのは、型ごとの標本が1件しかなく過適合になるためである。
既定を引き直す案は採らなかった。AI 4モデルの実測範囲が閾値の下に収まり、
`ja.renyo_te_ratio` と `ja.kango_ratio` が検出力を失うためである。
`ja.renyo_per_1k` と `ja.mattr100` と `ja.kango_ratio` については、
この文体を通す閾値が AI の実測範囲の中か上に来ることを避けられない。
その3つで検出力が落ちることは承知の上で採った。経緯は D-51 にある。
"""

# 実測の最大は 12.75（design.md）。較正値 23.21 は採らない。
# AI 4モデルの実測範囲は 3.62–15.94 で、13.2 はその中に残る。
[thresholds."ja.renyo_te_ratio"]
value = 13.2

# 実測の最大は 7.16（CLAUDE.md）。較正値 9.36 は採らない。
# AI 4モデルの実測範囲は 4.81–6.75 で、7.16 はこれを超える。
# この文体を通す閾値は AI の範囲の上に来る。検出力は落ちる。
[thresholds."ja.renyo_per_1k"]
value = 7.4

# 実測の最大は 0.6235（design.md）。AI 4モデルの実測範囲は 0.629–0.665。
# この文体を通す閾値は AI の範囲に入る。検出力は落ちる。
[thresholds."ja.mattr100"]
value = 0.64

# 実測の最大は 0.5871（design.md）。AI 4モデルの実測範囲は 0.455–0.519。
# この文体を通す閾値は AI の範囲を超える。検出力は落ちる。severity は info のまま。
[thresholds."ja.kango_ratio"]
value = 0.59
