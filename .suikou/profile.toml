# このリポジトリの文書に当てる閾値。組み込みの `oss` に重ねる。
#
# 2026-11-24 のコミット 7d07fc5 で Gemini（neon）が26ファイルを書き直した。
# その文体をこのリポジトリの文書の基準として採用したため、閾値を較正し直す。
# これは組み込みのプロファイルを置き換えるものではない。
# `crates/suikou-core/profiles/oss.toml` の既定は人間コーパスの実測による較正であり、
# 利用者の文書に対する判定は変わらない。
#
# 較正は次のコマンドで再現できる。
#
#   suikou baseline CLAUDE.md README.ja.md docs/content/ja/*.md --lang ja
#
# `ja.demonstrative_per_1k` と `ja.keishiki_meishi_per_1k` は較正の対象外である。
# どちらも境界が値域の外に出るため、`baseline` が較正を断る。
# 指示詞については既定の 4.5 を保ち、下回っていた文書の側を直した。
# neon の書き直しはこの指標を人間ネイティブの範囲に改善しており、
# 文書を直す方向が採用した文体に反しない。

reason = """
neon の文体（7d07fc5）をこのリポジトリの文書の基準として採用した。
標本はこのリポジトリの日本語文書9件で、`baseline.rs` が4件未満の標本を断る条件を満たす。
型ごとの `[doctype.*]` に手で置かないのは、型ごとの標本が1件しかなく過適合になるためである。
既定を引き直す案は採らなかった。AI 4モデルの実測範囲が丸ごと閾値の下に収まり、
`ja.renyo_te_ratio` と `ja.kango_ratio` が検出力を失うためである。
値は較正の出力を、較正値以上になる側へ丸めた。9件の標本に15桁の精度は無い。
経緯は D-51 にある。
"""

