# suikou の用語集を textlint-rule-prh の辞書にしたもの。
#
# このファイルは生成物である。手で直さず、
# crates/suikou-core/data/glossary_ja.toml を直して
# research/glossary/build_glossary.py を走らせる。
#
# 計測: 2026-11-13  参照: corpus/cache/pro_ja（4,382,318 字）
# 表記: 語ごとに実測で決める。決まらない語は長音に倒す（D-38）
# 参考: JTCA 外来語（カタカナ）表記ガイドライン 第3版（2015）
#
# 使い方（.textlintrc.yml）:
#   rules:
#     prh:
#       rulePaths: [glossary/suikou-ja.prh.yml]

version: 1
rules:
  # measured: 長音 591 / 長音なし 130
  - expected: サーバー
    patterns:
      - サーバ
  # measured: 長音 1830 / 長音なし 328
  - expected: ユーザー
    patterns:
      - ユーザ
  # measured: 長音 441 / 長音なし 120
  - expected: ブラウザー
    patterns:
      - ブラウザ
  # measured: 長音 158 / 長音なし 6
  - expected: パラメーター
    patterns:
      - パラメータ
  # measured: 長音 1279 / 長音なし 5
  - expected: クラスター
    patterns:
      - クラスタ
  # measured: 長音 93 / 長音なし 2
  - expected: レイヤー
    patterns:
      - レイヤ
  # fallback-choon: 長音 21 / 長音なし 10。差が2倍に届かず実測で決まらないため長音に倒す
  - expected: フォルダー
    patterns:
      - フォルダ
  # fallback-choon: 長音 28 / 長音なし 34。差が2倍に届かず実測で決まらないため長音に倒す
  - expected: コンピューター
    patterns:
      - コンピュータ
  # measured: 長音 95 / 長音なし 1783
  - expected: コンテナ
    patterns:
      - コンテナー
  # measured: 長音 3 / 長音なし 870
  - expected: プロパティ
    patterns:
      - プロパティー
  # measured: 長音 75 / 長音なし 402
  - expected: メモリ
    patterns:
      - メモリー
  # measured: 長音 9 / 長音なし 227
  - expected: ディレクトリ
    patterns:
      - ディレクトリー
  # root cause: 参照コーパスで根因 0 / 根本原因 2。PLaMo も根本原因と訳す
  - expected: 根本原因
    patterns:
      - 根因
  # time window: 参照コーパスで時間窓 0 / 時間枠 1。PLaMo は時間枠と時間幅を出す
  - expected: 時間枠
    patterns:
      - 時間窓
  # baseline: 参照コーパスで基準線 0 / ベースライン 12。PLaMo は文によってベースラインと基準値に分かれた
  - expected: ベースライン
    patterns:
      - 基準線
    # 文字どおりの意味は残す: 基準の実装
  # background job: 参照コーパスで背景実行 0 / バックグラウンド 20。PLaMo もバックグラウンドジョブと訳す
  - expected: バックグラウンドジョブ
    patterns:
      - 背景実行
  # watcher: 参照コーパスで見張り 0 / ウォッチャー 55。PLaMo はウォッチャーと観測者を出す
  - expected: ウォッチャー
    patterns:
      - 見張り
  # version: kata_pairs_ja.toml の実測。PLaMo もバージョンと訳す
  - expected: バージョン
    patterns:
      - 版
    # 文字どおりの意味は残す: 第2版 日本語版 改訂版 初版 英語版
  # branch: kata_pairs_ja.toml の実測（分岐→ブランチ）。PLaMo もブランチと訳す
  - expected: ブランチ
    patterns:
      - 枝
    # 文字どおりの意味は残す: 枝分かれ 木の枝
  # exclude: 参照 0.06 / このリポジトリ 1.90（万字あたり）。32倍
  - expected: 除外する
    patterns:
      - 外す
    # 文字どおりの意味は残す: 取り外す 的を外す
  # remove: 参照 0.01 / このリポジトリ 0.30（万字あたり）。30倍
  - expected: 除去する
    patterns:
      - 落とす
    # 文字どおりの意味は残す: 読み落とす 見落とす 書き落とす
  # detect: 参照 0.00 / このリポジトリ 0.60（万字あたり）。参照はほぼ使わない
  - expected: 検出する
    patterns:
      - 拾う
  # unify: 参照 0.00 / このリポジトリ 0.20（万字あたり）。参照はほぼ使わない
  - expected: 統一する
    patterns:
      - 寄せる
    # 文字どおりの意味は残す: 取り寄せる 呼び寄せる
  # collate: 参照 0.00 / このリポジトリ 0.10（万字あたり）。参照はほぼ使わない
  - expected: 照合する
    patterns:
      - 突き合わせる
  # establish as a norm: `置く` は物を据える像、`敷く` は面に広げる像で、どちらも規範を受けない
  - expected: 規範とする
    patterns:
      - 規範を置く
      - 規範を敷く
  # create a document: 参照 0 / このリポジトリ 1。動詞は参照 作成する 1.20 / を作る 0.14
  - expected: 文書を作成する
    patterns:
      - 文書を作る
  # build a table: 参照 0 / このリポジトリ 1。同じ
  - expected: 対応表を作成する
    patterns:
      - 対応表を作る
  # generate a profile: 参照 0 / このリポジトリ 1。同じ
  - expected: プロファイルを作成する
    patterns:
      - プロファイルを作る
